    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");

      :root {
        /* Warm Architectural Ivory Light Palette (Default) */
        --bg-base: #f5f3ee;
        --bg-grid: rgba(15, 23, 42, 0.045);
        --surface: rgba(255, 255, 255, 0.88);
        --surface-elevated: #ffffff;
        --surface-solid: #ffffff;
        --text-primary: #111318;
        --text-secondary: #4b5563;
        --text-muted: #6b7280;
        --border-subtle: rgba(17, 19, 24, 0.08);
        --border-hover: rgba(217, 119, 6, 0.42);
        --spotlight: rgba(245, 158, 11, 0.13);
        --accent-1: #f59e0b; /* Warm Saffron Gold */
        --accent-2: #fb7185; /* Coral Rose */
        --accent-3: #6366f1; /* Electric Indigo */
        --accent-pill-bg: #fffbeb;
        --accent-pill-border: #fde68a;
        --accent-pill-text: #b45309;
        --btn-primary-bg: #111318;
        --btn-primary-text: #ffffff;
        --btn-secondary-bg: rgba(17, 19, 24, 0.045);
        --btn-secondary-text: #111318;
        --nav-bg: rgba(255, 255, 255, 0.84);
        --nav-active-bg: #111318;
        --nav-active-text: #ffffff;
        --shadow-card: 0 18px 42px -18px rgba(17, 19, 24, 0.1), 0 2px 6px -2px rgba(17, 19, 24, 0.04);
        --radius-bento: 28px;
        --radius-card: 22px;
        --radius-pill: 9999px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      [data-theme="dark"] {
        /* Midnight Obsidian Studio Palette (Dark Mode) */
        --bg-base: #07080d;
        --bg-grid: rgba(255, 255, 255, 0.032);
        --surface: rgba(17, 20, 30, 0.78);
        --surface-elevated: rgba(24, 28, 42, 0.88);
        --surface-solid: #11141e;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.2);
        --spotlight: rgba(245, 158, 11, 0.14);
        --accent-pill-bg: rgba(245, 158, 11, 0.12);
        --accent-pill-border: rgba(245, 158, 11, 0.28);
        --accent-pill-text: #fbbf24;
        --btn-primary-bg: #f8fafc;
        --btn-primary-text: #090b12;
        --btn-secondary-bg: rgba(255, 255, 255, 0.06);
        --btn-secondary-text: #f8fafc;
        --nav-bg: rgba(13, 16, 25, 0.76);
        --nav-active-bg: #f8fafc;
        --nav-active-text: #090b12;
        --shadow-card: 0 20px 50px -18px rgba(0, 0, 0, 0.65);

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

      body {
        font-family: "Inter", "Noto Sans Oriya", sans-serif;
        background-color: var(--bg-base);
        color: var(--text-primary);
        line-height: 1.72;
        min-height: 100vh;
        padding-top: 96px;
        padding-bottom: 48px;
        overflow-x: hidden;
        transition: background-color 0.35s ease, color 0.35s ease;
        position: relative;
      }

      h1, h2, h3, .brand-mark, .card-index {
        font-family: "Space Grotesk", "Noto Sans Oriya", sans-serif;
      }

      /* Odia Typography Safeguards (prevents bottom matra & conjunct clipping) */
      html[lang="or"] body {
        line-height: 1.82;
      }

      html[lang="or"] h1,
      html[lang="or"] h2,
      html[lang="or"] h3,
      html[lang="or"] .block-title,
      html[lang="or"] .cta-copy h2,
      html[lang="or"] .about-story-card h2,
      html[lang="or"] .projects-hero-banner h2,
      html[lang="or"] .menu-links li a {
        letter-spacing: 0 !important;
      }

      /* Architectural Subtle Grid + Warm Aurora Glow */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse 85% 70% at 50% 15%, #000 35%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 15%, #000 35%, transparent 100%);
        pointer-events: none;
        z-index: -2;
      }

      .aurora-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        overflow: hidden;
      }

      .aurora-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.18;
      }

      [data-theme="dark"] .aurora-blob {
        opacity: 0.24;
      }

      .aurora-1 {
        width: 560px;
        height: 560px;
        background: radial-gradient(circle, #f59e0b, transparent 70%);
        top: -220px;
        right: -120px;
      }

      .aurora-2 {
        width: 520px;
        height: 520px;
        background: radial-gradient(circle, #6366f1, transparent 70%);
        bottom: -180px;
        left: -140px;
      }

      .aurora-3 {
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, #fb7185, transparent 70%);
        top: 42%;
        left: 48%;
        opacity: 0.11;
      }

      /* Container */
      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* Top Studio Navigation Bar */
      .main-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        padding: 16px 24px;
        pointer-events: none;
      }

      .header-inner {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        pointer-events: auto;
      }

      .brand-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 16px 7px 8px;
        background: var(--nav-bg);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-pill);
        box-shadow: 0 8px 24px -10px rgba(17, 19, 24, 0.1);
        text-decoration: none;
        color: var(--text-primary);
        cursor: pointer;
        transition: border-color 0.25s ease, transform 0.25s var(--ease);
      }

      .brand-pill:hover {
        border-color: var(--border-hover);
        transform: translateY(-1px);
      }

      .brand-avatar-mini {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid var(--accent-1);
      }

      .brand-mark {
        font-weight: 700;
        font-size: 0.92rem;
        letter-spacing: 0.02em;
      }

      /* Center Segmented Nav Tabs */
      .center-nav {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px;
        background: var(--nav-bg);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-pill);
        box-shadow: 0 10px 28px -10px rgba(17, 19, 24, 0.12);
      }

      [data-theme="dark"] .center-nav {
        box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.45);
      }

      .nav-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: var(--radius-pill);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        line-height: 1.5;
        text-decoration: none;
        border: none;
        background: transparent;
        cursor: pointer;
        transition: all 0.28s var(--ease);
        white-space: nowrap;
      }

      .nav-tab svg {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }

      .nav-tab:hover {
        color: var(--text-primary);
        background: rgba(17, 19, 24, 0.05);
      }

      [data-theme="dark"] .nav-tab:hover {
        background: rgba(255, 255, 255, 0.07);
      }

      .nav-tab.active-nav {
        background: var(--nav-active-bg);
        color: var(--nav-active-text);
        box-shadow: 0 6px 18px -6px rgba(17, 19, 24, 0.3);
      }

      /* Right Action Cluster */
      .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px;
        background: var(--nav-bg);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-pill);
        box-shadow: 0 8px 24px -10px rgba(17, 19, 24, 0.1);
      }

      .icon-ctrl-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.25s var(--ease);
      }

      .icon-ctrl-btn:hover {
        color: var(--text-primary);
        background: rgba(17, 19, 24, 0.06);
      }

      [data-theme="dark"] .icon-ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .icon-ctrl-btn svg {
        width: 19px;
        height: 19px;
      }

      .language-switcher {
        padding: 9px 16px;
        border-radius: var(--radius-pill);
        border: none;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color: #ffffff;
        font-family: inherit;
        font-size: 0.84rem;
        font-weight: 700;
        line-height: 1.5;
        cursor: pointer;
        transition: all 0.25s var(--ease);
        box-shadow: 0 6px 18px -6px rgba(245, 158, 11, 0.55);
      }

      .language-switcher:hover {
        transform: translateY(-1px) scale(1.02);
        box-shadow: 0 10px 22px -6px rgba(245, 158, 11, 0.65);
      }

      /* Page Transitions */
      .page-content {
        display: none;
      }

      .page-content.active {
        display: block;
        animation: studioReveal 0.5s var(--ease) forwards;
      }

      @keyframes studioReveal {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Universal Bento Card with Mouse Spotlight */
      .bento-card {
        position: relative;
        background: var(--surface);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-bento);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        transition: border-color 0.3s ease, transform 0.35s var(--ease), background-color 0.35s ease;
      }

      .bento-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          520px circle at var(--mx, 50%) var(--my, 50%),
          var(--spotlight),
          transparent 48%
        );
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
        z-index: 0;
      }

      .bento-card:hover::before {
        opacity: 1;
      }

      .bento-card:hover {
        border-color: var(--border-hover);
      }

      .bento-card > * {
        position: relative;
        z-index: 1;
      }

      /* ===== HOME BENTO GRID ===== */
      .home-bento-top {
        display: grid;
        grid-template-columns: 1.45fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .hero-bento {
        padding: 42px 38px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 410px;
      }

      .hero-top-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }

      .location-chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 7px 15px;
        border-radius: var(--radius-pill);
        color: #047857;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.5;
      }

      [data-theme="dark"] .location-chip {
        background: rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.25);
        color: #34d399;
      }

      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25);
        animation: pulseLive 2.2s infinite;
        flex-shrink: 0;
      }

      @keyframes pulseLive {
        0%, 100% { box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3); }
        50% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      }

      .greeting-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 15px;
        border-radius: var(--radius-pill);
        background: var(--accent-pill-bg);
        border: 1px solid var(--accent-pill-border);
        color: var(--accent-pill-text);
        font-size: 0.86rem;
        font-weight: 700;
        line-height: 1.5;
      }

      .hero-bento h1 {
        font-size: clamp(2.25rem, 4.8vw, 3.55rem);
        font-weight: 700;
        line-height: 1.38;
        letter-spacing: -0.03em;
        padding-top: 0.08em;
        padding-bottom: 0.24em;
        margin-bottom: 12px;
        background: linear-gradient(135deg, var(--text-primary) 42%, #d97706 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      [data-theme="dark"] .hero-bento h1 {
        background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-1) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: auto;
        padding-top: 10px;
      }

      /* Right Stack in Hero Bento */
      .hero-right-stack {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 20px;
      }

      .portrait-bento {
        min-height: 270px;
        padding: 0;
        display: flex;
        align-items: flex-end;
      }

      .portrait-bento img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
        transition: transform 0.65s var(--ease);
        z-index: 0;
      }

      .portrait-bento:hover img {
        transform: scale(1.05);
      }

      .portrait-overlay {
        position: relative;
        z-index: 2;
        width: 100%;
        padding: 48px 22px 20px;
        background: linear-gradient(to top, rgba(11, 13, 20, 0.86) 0%, rgba(11, 13, 20, 0.25) 55%, transparent 100%);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }

      .portrait-caption {
        color: #ffffff;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.01em;
      }

      .portrait-tag {
        padding: 5px 12px;
        border-radius: var(--radius-pill);
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(10px);
        color: #ffffff;
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1.5;
        border: 1px solid rgba(255, 255, 255, 0.26);
      }

      /* Social Bento Strip */
      .social-bento {
        padding: 18px 20px;
      }

      .social-bento-label {
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 12px;
      }

      html[lang="or"] .social-bento-label {
        text-transform: none;
        letter-spacing: 0;
        font-size: 0.88rem;
      }

      .social-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .social-tile {
        height: 52px;
        border-radius: 16px;
        background: var(--btn-secondary-bg);
        border: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        text-decoration: none;
        transition: all 0.28s var(--ease);
      }

      .social-tile svg {
        width: 21px;
        height: 21px;
      }

      .social-tile:hover {
        transform: translateY(-4px);
        color: #ffffff;
        border-color: transparent;
      }

        background: #ef4444;
        box-shadow: 0 12px 24px -6px rgba(239, 68, 68, 0.45);

        box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.45);

      .btn {

        height: 18px;

      }

      .btn-primary {
        background: var(--btn-primary-bg);
        color: var(--btn-primary-text);
        box-shadow: 0 10px 26px -8px rgba(17, 19, 24, 0.28);
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));

        transform: translateY(-2px);
        box-shadow: 0 14px 30px -8px rgba(245, 158, 11, 0.5);
      }

      .btn-secondary {
        background: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
        border-color: var(--border-subtle);
      }

      .btn-secondary:hover {
        border-color: var(--border-hover);
        transform: translateY(-2px);
        background: #ffffff;
        box-shadow: 0 8px 20px -8px rgba(17, 19, 24, 0.12);
      }

      [data-theme="dark"] .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.12);
        box-shadow: none;
      }

      /* ===== PROJECTS SHOWCASE (APP-STORE STYLE CARDS) ===== */
      .showcase-block {
        margin-bottom: 20px;
      }

      .block-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;

        padding: 4px 11px;
        border-radius: var(--radius-pill);
        background: var(--accent-pill-bg);
        border: 1px solid var(--accent-pill-border);
        color: var(--accent-pill-text);
      }

      .view-all-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: var(--radius-pill);
        background: var(--surface);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.86rem;
        font-weight: 600;
        line-height: 1.5;
        cursor: pointer;
        transition: all 0.25s var(--ease);
      }

      .view-all-link:hover {
        border-color: var(--accent-1);
        color: var(--accent-pill-text);
        transform: translateX(3px);
      }

      .home-projects-grid,
      .all-projects-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }

      .app-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        min-height: 224px;
        text-decoration: none;
        color: var(--text-primary);
        border-radius: var(--radius-card);
        animation: cardPop 0.45s var(--ease) both;
      }

      @keyframes cardPop {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .app-card:hover {
        transform: translateY(-6px);
      }

      .app-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      .app-icon-shell {
        position: relative;
        width: 62px;
        height: 62px;
        border-radius: 18px;
        background: #f8fafc;
        border: 1px solid rgba(17, 19, 24, 0.08);
        padding: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 22px -8px rgba(17, 19, 24, 0.14);
        transition: transform 0.35s var(--ease);
      }

      [data-theme="dark"] .app-icon-shell {
        background: rgba(255, 255, 255, 0.95);
        border-color: transparent;
        box-shadow: 0 12px 26px -8px rgba(0, 0, 0, 0.38);
      }

      .app-card:hover .app-icon-shell {
        transform: scale(1.08) rotate(-2deg);
      }

      .app-icon-shell img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 10px;
      }

      .app-card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card-index {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--text-muted);
      }

      .app-launch-arrow {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--btn-secondary-bg);
        border: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        font-size: 1rem;
        transition: all 0.28s var(--ease);
      }

      .app-card:hover .app-launch-arrow {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        border-color: transparent;
        color: #ffffff;
        transform: translate(2px, -2px);
      }

      .app-card-body h3 {
        font-size: 1.18rem;
        font-weight: 700;
        line-height: 1.5;
        letter-spacing: -0.015em;
        padding-bottom: 2px;
        margin-bottom: 6px;
        color: var(--text-primary);
      }

      .app-card-body p {
        font-size: 0.9rem;
        color: var(--text-secondary);
        line-height: 1.72;
      }

      /* ===== HORIZONTAL SPOTLIGHT CTA BANNER ===== */
      .cta-bento {
        padding: 40px 42px;
        background:
          radial-gradient(circle at 92% 15%, rgba(245, 158, 11, 0.22), transparent 46%),
          radial-gradient(circle at 8% 95%, rgba(99, 102, 241, 0.16), transparent 46%),
          var(--surface-elevated);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }

      [data-theme="dark"] .cta-bento {
        background:
          radial-gradient(circle at 92% 15%, rgba(245, 158, 11, 0.28), transparent 45%),
          radial-gradient(circle at 8% 95%, rgba(99, 102, 241, 0.26), transparent 45%),
          var(--surface-elevated);
      }

      .cta-copy {
        max-width: 560px;
      }

      .cta-copy h2 {
        font-size: clamp(1.75rem, 3.6vw, 2.45rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.4;
        padding-bottom: 0.1em;
        margin-bottom: 8px;
      }

      .cta-copy p {
        font-size: 1.02rem;
        line-height: 1.75;
        color: var(--text-secondary);
      }

      .cta-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        flex-shrink: 0;
      }

      /* ===== ABOUT / PROFILE 2-COLUMN EDITORIAL LAYOUT ===== */
      .about-grid {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        align-items: start;
      }

      .about-sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
        position: sticky;
        top: 96px;
      }

      .about-photo-card {
        aspect-ratio: 4 / 4.4;
        padding: 0;
      }

      .about-photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .about-side-card {
        padding: 24px;
      }

      .about-side-card h3 {
        font-size: 0.86rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        line-height: 1.5;
        color: var(--text-muted);
        margin-bottom: 14px;
      }

      html[lang="or"] .about-side-card h3 {
        text-transform: none;
        letter-spacing: 0;
        font-size: 0.95rem;
      }

      .interest-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .interest-tag {
        padding: 8px 14px;
        border-radius: var(--radius-pill);
        background: var(--btn-secondary-bg);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        font-size: 0.86rem;
        font-weight: 600;
        line-height: 1.45;
        transition: all 0.25s var(--ease);
      }

      .interest-tag:hover {
        border-color: var(--accent-1);
        color: var(--accent-pill-text);
        transform: translateY(-2px);
      }

      .about-main {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .about-story-card {
        padding: 38px;
      }

      .about-story-card h2 {
        font-size: clamp(1.9rem, 4vw, 2.6rem);
        font-weight: 700;
        line-height: 1.42;
        padding-top: 0.06em;
        padding-bottom: 0.22em;
        letter-spacing: -0.03em;
        margin-bottom: 12px;
        background: linear-gradient(135deg, var(--text-primary) 45%, #d97706 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .profile-bio {
        font-size: 1.08rem;
        line-height: 1.95;
        color: var(--text-secondary);
      }

      .profile-bio b {
        color: var(--text-primary);
      }

      .profile-bio i {
        display: inline-block;
        margin-top: 18px;
        font-style: normal;
        font-weight: 700;
        line-height: 1.55;
        color: var(--accent-pill-text);
        background: var(--accent-pill-bg);
        border: 1px solid var(--accent-pill-border);
        padding: 6px 16px;
        border-radius: var(--radius-pill);
      }

      .lifestyle-card {
        padding: 32px;
      }

      .instagram-frame {
        margin-top: 18px;
        padding: 14px;
        background: #ffffff;
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        display: flex;
        justify-content: center;
        overflow: hidden;
      }

      /* ===== PROJECTS PAGE HEADER ===== */
      .projects-hero-banner {
        padding: 34px 36px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }

      .projects-hero-banner h2 {
        font-size: clamp(2rem, 4.5vw, 2.85rem);
        font-weight: 700;
        line-height: 1.42;
        padding-top: 0.06em;
        padding-bottom: 0.22em;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, var(--text-primary) 45%, #d97706 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ===== RIGHT-SIDE SLIDE-OVER MENU DRAWER ===== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 2000;
        display: flex;
        justify-content: flex-end;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .modal-overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .menu-drawer {
        width: 100%;
        max-width: 420px;
        height: 100%;
        background: var(--surface-solid);
        border-left: 1px solid var(--border-subtle);
        padding: 32px 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transform: translateX(100%);
        transition: transform 0.42s var(--ease);
        box-shadow: -24px 0 60px rgba(0, 0, 0, 0.25);
      }

      .modal-overlay.show .menu-drawer {
        transform: translateX(0);
      }

      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .drawer-brand {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        color: var(--accent-pill-text);
      }

      .close-modal-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--border-subtle);
        background: var(--btn-secondary-bg);
        color: var(--text-primary);
        font-size: 1.5rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s var(--ease);
      }

      .close-modal-btn:hover {
        background: var(--accent-1);
        color: #ffffff;
        border-color: transparent;
        transform: rotate(90deg);
      }

      .menu-links {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: auto 0;
        padding: 20px 0;
      }

      .menu-links li a {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 15px 14px;
        border-radius: 16px;
        text-decoration: none;
        color: var(--text-primary);
        font-family: "Space Grotesk", "Noto Sans Oriya", sans-serif;
        font-size: 1.4rem;
        font-weight: 700;
        line-height: 1.5;
        transition: all 0.25s var(--ease);
      }

      .menu-links li a .menu-num {
        font-size: 0.82rem;
        color: var(--accent-1);
        font-weight: 700;
        flex-shrink: 0;
      }

      .menu-links li a:hover {
        background: var(--btn-secondary-bg);
        color: var(--accent-pill-text);
        transform: translateX(8px);
      }

      .drawer-footer {
        padding-top: 18px;
        border-top: 1px solid var(--border-subtle);
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      /* Footer */
      footer {
        margin-top: 34px;
        text-align: center;
        font-size: 0.88rem;
        color: var(--text-muted);
        padding: 18px 10px;
      }

      /* Floating Share FAB */
      #floating-share-btn {
        position: fixed;
        bottom: 26px;
        right: 26px;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 1px solid var(--border-subtle);
        background: var(--nav-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 999;
        box-shadow: 0 12px 28px -6px rgba(17, 19, 24, 0.2);
        transition: all 0.3s var(--ease);
      }

      #floating-share-btn:hover {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color: #ffffff;
        border-color: transparent;
        transform: translateY(-4px) scale(1.05);
      }

      #floating-share-btn svg {
        width: 22px;
        height: 22px;
      }

      /* Toast Notification */
      .toast-notification {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--nav-active-bg);
        color: var(--nav-active-text);
        padding: 11px 22px;
        border-radius: var(--radius-pill);
        font-size: 0.88rem;
        font-weight: 700;
        line-height: 1.5;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        box-shadow: 0 18px 36px -10px rgba(0, 0, 0, 0.35);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s var(--ease);
        z-index: 3000;
        white-space: nowrap;
      }

      .toast-notification.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .toast-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        flex-shrink: 0;
      }

      /* ===== RESPONSIVE BREAKPOINTS ===== */
      @media (max-width: 960px) {
        .home-bento-top {
          grid-template-columns: 1fr;
        }

        .hero-bento {
          min-height: auto;
        }

        .hero-right-stack {
          grid-template-columns: 1fr 1fr;
          grid-template-rows: auto;
        }

        .portrait-bento {
          min-height: 240px;
        }

        .home-projects-grid,
        .all-projects-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .cta-bento {
          flex-direction: column;
          text-align: center;
          padding: 36px 28px;
        }

        .cta-buttons {
          justify-content: center;
        }

        .about-grid {
          grid-template-columns: 1fr;
        }

        .about-sidebar {
          position: static;
        }

        .about-photo-card {
          max-width: 360px;
          margin: 0 auto;
          width: 100%;
        }
      }

      @media (max-width: 720px) {
        body {
          padding-top: 84px;
          padding-bottom: 108px;
        }

        .container {
          padding: 0 16px;
        }

        .main-header {
          padding: 12px 16px;
        }

        /* Transform Center Nav into Floating Bottom Thumb Dock on Mobile */
        .center-nav {
          position: fixed;
          bottom: 16px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 1050;
          padding: 6px;
          width: calc(100% - 32px);
          max-width: 400px;
          justify-content: space-between;
          box-shadow: 0 16px 36px -8px rgba(17, 19, 24, 0.25);
        }

        [data-theme="dark"] .center-nav {
          box-shadow: 0 18px 40px -8px rgba(0, 0, 0, 0.65);
        }

        .nav-tab {
          flex: 1;
          justify-content: center;
          padding: 10px 8px;
          font-size: 0.82rem;
          gap: 6px;
        }

        .hero-bento {
          padding: 28px 22px;
        }

        .hero-right-stack {
          grid-template-columns: 1fr;
        }

        .home-projects-grid,
        .all-projects-grid {
          grid-template-columns: 1fr;
        }

        .about-story-card,
        .lifestyle-card,
        .projects-hero-banner {
          padding: 24px 20px;
        }

        #floating-share-btn {
          bottom: 86px;
          right: 16px;
          width: 48px;
          height: 48px;
        }

        .toast-notification {
          bottom: 92px;
        }
      }

      @media (max-width: 460px) {
        .brand-mark {
          display: none;
        }

        .brand-pill {
          padding: 6px;
        }

        .hero-actions .btn,
        .cta-buttons .btn {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

        <div class="header-controls">

            <svg id="theme-icon-sun" style="display:none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />

    <!-- Slide-Over Menu Drawer -->
    <div id="menu-overlay" class="modal-overlay"></div>

    <div class="container">
      <main>
        <!-- Page Contents -->
        <div id="home-content" class="page-content active"></div>
        <div id="profile-content" class="page-content"></div>

                <img src="https://imsbg.github.io/images/sandeep-biswal-g/sandeep.jpg" alt="Sandeep Biswal G">

              <div class="bento-card about-side-card">
                <h3 data-lang-en="Interests" data-lang-or="ଆଗ୍ରହ"></h3>
                <div class="interest-tags">
                  <span class="interest-tag">Photography</span>
                  <span class="interest-tag">Traveling</span>
                  <span class="interest-tag">Tech Gadgets</span>

              <div class="bento-card about-side-card">
                <h3 data-lang-en="Follow Me on Social Media" data-lang-or="ସୋସିଆଲ ମିଡିଆରେ ମୋତେ ଅନୁସରଣ କରନ୍ତୁ"></h3>

            <div class="about-main">
              <section class="bento-card about-story-card">
                <h2 data-lang-en="About Me" data-lang-or="ମୋ ବିଷୟରେ"></h2>
                <p class="profile-bio" data-lang-en="Jay Jagannatha! I'm Sandeep Biswal, a guy from Odisha. I really love technology. Exploring new places, experiencing nature, and learning about the digital world are my passions. My one and only goal is to bring our Odia language forward in technology. I want our people to be able to use all digital things easily in their own language.<br><i>Glory to thee, Mother Utkala</i>" data-lang-or="ଜୟ ଜଗନ୍ନାଥ, ମୁଁ, <b>ସନ୍ଦୀପ୍ ବିଶ୍ଵାଳ</b> ଆଉ ମୁଁ ଓଡ଼ିଶାର ପିଲା । ଟେକ୍ନୋଲୋଜି ମୋତେ ଭାରି ଭଲ ଲାଗେ । ନୂଆ ନୂଆ ଜାଗା ବୁଲିବା, ପ୍ରକୃତିକୁ ଦେଖିବା ଆଉ ଡିଜିଟାଲ ଦୁନିଆ ବିଷୟରେ ଜାଣିବା ମୋର ସଉକ । ମୋର ଗୋଟିଏ ହିଁ ଲକ୍ଷ୍ୟ, ଟେକ୍ନୋଲୋଜିରେ ଆମ ଓଡ଼ିଆ ଭାଷାକୁ ଆଗକୁ ନେବା । ମୁଁ ଚାହେଁ ଯେମିତି ଆମ ଲୋକମାନେ ସବୁ ଡିଜିଟାଲ୍ ଜିନିଷକୁ ସହଜରେ ନିଜ ଭାଷାରେ ବ୍ୟବହାର କରନ୍ତୁ । <br><i>ବନ୍ଦେ ଉତ୍କଳ ଜନନୀ</i>"></p>
              </section>

              <section class="bento-card lifestyle-card">
                <div class="block-title-wrap">
                  <h2 class="block-title" data-lang-en="Lifestyle" data-lang-or="ଜୀବନଶୈଳୀ"></h2>
                </div>
                <div class="instagram-frame">
                  <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/sandeepbiswalg/" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:12px; box-shadow:none; margin: 0 auto; max-width:540px; min-width:260px; padding:0; width:100%;"></blockquote>
                </div>
              </section>
            </div>
          </div>`;

        // PROJECTS PAGE (3-Column Showcase Grid)
        document.getElementById("projects-content").innerHTML = `
          <div class="bento-card projects-hero-banner">
            <div>
              <h2 data-lang-en="My Works" data-lang-or="ମୋର କାର୍ଯ୍ୟଗୁଡ଼ିକ"></h2>
              <p data-lang-en="" data-lang-or=""></p>
            </div>
            <span class="block-count">${projectsData.length}</span>
          </div>
          <div class="all-projects-grid">${allProjectsHTML}</div>`;

        // SLIDE-OVER MENU DRAWER
        document.getElementById("menu-overlay").innerHTML = `
          <div class="menu-drawer">
            <div class="drawer-header">
              <span class="drawer-brand">SANDEEP BISWAL G</span>
              <button id="close-menu-btn" class="close-modal-btn" title="Close Menu" aria-label="Close Menu">&times;</button>
            </div>
            <ul class="menu-links">
              <li><a href="https://imsbg.github.io/?od#ଘର"><span class="menu-num">01</span><span data-lang-en="Home" data-lang-or="ହୋମ୍"></span></a></li>
              <li><a href="https://imsbg.github.io/?od#about"><span class="menu-num">02</span><span data-lang-en="About" data-lang-or="ମୋ ବିଷୟରେ"></span></a></li>
              <li><a href="https://play.google.com/store/apps/details?id=in.sandeep.odiabhasa"><span class="menu-num">03</span><span data-lang-en="Odia Bhasa ଆପ୍" data-lang-or="ଓଡ଼ିଆ ଭାଷା ଆପ୍"></span></a></li>
              <li><a href="https://www.instagram.com/sandeepbiswalg"><span class="menu-num">04</span><span data-lang-en="Follow Me" data-lang-or="ମୋତେ ଅନୁସରଣ କରନ୍ତୁ
"></span></a></li>
              <li><a href="mailto:message.sbg@gmail.com"><span class="menu-num">05</span><span data-lang-en="Contact" data-lang-or="ଯୋଗାଯୋଗ"></span></a></li>
            </ul>
            <div class="drawer-footer">message.sbg@gmail.com</div>
          </div>`;
      }

      // --- SCRIPT INITIALIZATION ---
      document.addEventListener("DOMContentLoaded", () => {
        populateContent();

        // --- DOM REFERENCES ---
        const brandHomeLink = document.getElementById("brand-home-link");
        const homeNavBtn = document.getElementById("home-nav-btn");
        const profileNavBtn = document.getElementById("profile-btn");
        const projectsNavBtn = document.getElementById("projects-nav-btn");
        const homeContent = document.getElementById("home-content");
        const profileContent = document.getElementById("profile-content");
        const projectsContent = document.getElementById("projects-content");
        const menuBtn = document.getElementById("menu-btn");
        const menuOverlay = document.getElementById("menu-overlay");
        const closeMenuBtn = document.getElementById("close-menu-btn");
        const viewAllProjectsBtn = document.getElementById("view-all-projects-btn");
        const langSwitcher = document.getElementById("language-switcher");
        const shareBtn = document.getElementById("floating-share-btn");
        const themeToggleBtn = document.getElementById("theme-toggle-btn");
        const themeIconSun = document.getElementById("theme-icon-sun");
        const themeIconMoon = document.getElementById("theme-icon-moon");
        const toast = document.getElementById("toast");
        const toastMessage = document.getElementById("toast-message");

        const allPages = [homeContent, profileContent, projectsContent];
        const allNavBtns = [homeNavBtn, profileNavBtn, projectsNavBtn];
        let currentLanguage = "or";
        let toastTimer = null;

        // --- INTERACTIVE MOUSE SPOTLIGHT ON BENTO CARDS ---
        const bindSpotlights = () => {
          document.querySelectorAll(".bento-card").forEach((card) => {
            card.addEventListener("pointermove", (e) => {
              if (e.pointerType !== "mouse") return;
              const rect = card.getBoundingClientRect();
              card.style.setProperty("--mx", `${e.clientX - rect.left}px`);
              card.style.setProperty("--my", `${e.clientY - rect.top}px`);
            });
          });
        };
        bindSpotlights();

        // --- THEME TOGGLE (Light Ivory Default / Dark Obsidian Optional) ---
        const applyTheme = (theme) => {
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            themeIconSun.style.display = "block";
            themeIconMoon.style.display = "none";
          } else {
            document.documentElement.removeAttribute("data-theme");
            themeIconSun.style.display = "none";
            themeIconMoon.style.display = "block";
          }
          try {
            localStorage.setItem("sbg-theme-mode", theme);
          } catch (_) {}
        };

        try {
          const savedTheme = localStorage.getItem("sbg-theme-mode");
          if (savedTheme === "dark") applyTheme("dark");
        } catch (_) {}

        themeToggleBtn.addEventListener("click", () => {
          const isDark = document.documentElement.getAttribute("data-theme") === "dark";
          applyTheme(isDark ? "light" : "dark");
        });

        // --- TOAST HELPER ---
        const showToast = (msg) => {
          toastMessage.textContent = msg;
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 2400);
        };

        // --- LANGUAGE HANDLING ---
        const setLanguage = (lang, isInitialLoad = false) => {
          currentLanguage = lang;
          document.documentElement.lang = currentLanguage;
          document.querySelectorAll("[data-lang-en]").forEach((el) => {
            const text = currentLanguage === "en" ? el.dataset.langEn : el.dataset.langOr;
            if (text) el.innerHTML = text;
          });
          langSwitcher.innerText =
            currentLanguage === "en" ? langSwitcher.dataset.langEn : langSwitcher.dataset.langOr;

          if (!isInitialLoad) {
            const url = new URL(window.location);
            url.search = "?" + (lang === "en" ? "en" : "od");
            window.history.replaceState({ lang }, "", url.href);
          }

          if (window.instgrm) {
            window.instgrm.Embeds.process();
          }
        };

        const checkUrlForLanguage = () => {
          const search = window.location.search;
          if (search === "?en") {
            setLanguage("en", true);
          } else {
            setLanguage("or", true);
          }
        };

        // --- PAGE NAVIGATION ---
        const setActivePage = (activePage, isInitialLoad = false) => {
          allPages.forEach((page) => page.classList.remove("active"));
          activePage.classList.add("active");

          if (!isInitialLoad) window.scrollTo({ top: 0, behavior: "smooth" });

          const activeIndex = allPages.indexOf(activePage);
          allNavBtns.forEach((btn) => btn.classList.remove("active-nav"));
          if (activeIndex !== -1) {
            allNavBtns[activeIndex].classList.add("active-nav");
          }

          if (!isInitialLoad) {
            let newHash = "#ଘର";
            if (activePage.id === "profile-content") newHash = "#about";
            if (activePage.id === "projects-content") newHash = "#projects";

            if (window.location.hash !== newHash) {
              window.history.pushState({ page: newHash }, "", newHash);
            }
          }

          if (activePage.id === "profile-content" && window.instgrm) {
            window.instgrm.Embeds.process();
          }
        };

        const checkUrlForHash = () => {
          const hash = window.location.hash;
          switch (hash) {
            case "#about":
              setActivePage(profileContent, true);
              break;
            case "#projects":
              setActivePage(projectsContent, true);
              break;
            case "#ଘର":
            default:
              setActivePage(homeContent, true);
              break;
          }
        };

        // --- EVENT LISTENERS ---
        brandHomeLink.addEventListener("click", (e) => {
          e.preventDefault();
          setActivePage(homeContent);
        });
        homeNavBtn.addEventListener("click", (e) => {
          e.preventDefault();
          setActivePage(homeContent);
        });
        profileNavBtn.addEventListener("click", () => setActivePage(profileContent));
        projectsNavBtn.addEventListener("click", () => setActivePage(projectsContent));
        viewAllProjectsBtn.addEventListener("click", () => projectsNavBtn.click());

        const closeMenu = () => menuOverlay.classList.remove("show");
        menuBtn.addEventListener("click", () => menuOverlay.classList.add("show"));
        closeMenuBtn.addEventListener("click", closeMenu);
        menuOverlay.addEventListener("click", (e) => {
          if (e.target === menuOverlay) closeMenu();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && menuOverlay.classList.contains("show")) closeMenu();
        });

        langSwitcher.addEventListener("click", () =>
          setLanguage(currentLanguage === "or" ? "en" : "or")
        );

        if (shareBtn) {
          shareBtn.addEventListener("click", async () => {
            const shareData = {
              title: document.title,
              text: "Check out Sandeep Biswal G's portfolio!",
              url: window.location.href,
            };
            try {
              if (navigator.share) {
                await navigator.share(shareData);
              } else {
                await navigator.clipboard.writeText(shareData.url);
                showToast(
                  currentLanguage === "en" ? "Link copied to clipboard!" : "ଲିଙ୍କ୍ କପି ହେଲା!"
                );
              }
            } catch (err) {
              console.error("Share failed:", err);
            }
          });
        }

        window.addEventListener("popstate", () => {
          checkUrlForHash();
        });

        const copyEmail = (buttonId) => {
          const copyBtn = document.getElementById(buttonId);
          const span = copyBtn.querySelector("span");
          const originalText =
            span.dataset[currentLanguage === "en" ? "langEn" : "langOr"];
          navigator.clipboard
            .writeText(myEmail)
            .then(() => {
              const copiedLabel = currentLanguage === "en" ? "Copied!" : "କପି ହେଲା!";
              span.innerText = copiedLabel;
              showToast(copiedLabel);
              setTimeout(() => {
                span.innerText = originalText;
              }, 2000);
            })
            .catch((err) => console.error("Failed to copy email: ", err));
        };

        document
          .getElementById("copy-email-btn")
          .addEventListener("click", () => copyEmail("copy-email-btn"));
        document
          .getElementById("copy-email-btn-2")
          .addEventListener("click", () => copyEmail("copy-email-btn-2"));

        // --- INITIALIZE ---
        checkUrlForLanguage();
        checkUrlForHash();
        document.getElementById("current-year").textContent = new Date().getFullYear();
      });
    </script>
  </body>
</html>
